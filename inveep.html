
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inveep - Stock Alert</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 25px;
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b55;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Tableau et calculateur sur la même ligne */
        .contenu {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .carte {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
            flex: 1;
            min-width: 0;
        }

        h2 {
            color: #263b55;
            font-size: 17px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Tableau */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background-color: #263b55;
            color: white;
            padding: 10px 6px;
            text-align: center;
        }

        td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f5f8fc;
        }

        /* Calculateur */
        label {
            display: block;
            margin-top: 13px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 13px;
            background-color: white;
        }

        input[readonly] {
            background-color: #f1f3f5;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            background-color: #263b55;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #365675;
        }

        #resultat {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }

        .alerte {
            background-color: #ffe5e5;
            color: #c62828;
        }

        .normal {
            background-color: #e4f5e9;
            color: #237a3b;
        }

        /* Adaptation aux petits écrans */
        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .contenu {
                flex-direction: column;
            }

            .carte {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Inveep – Stock Alert</h1>
        <p class="description">
            Gestion et suivi des stocks de produits
        </p>

        <div class="contenu">

            <!-- Tableau des stocks -->
            <div class="carte">

                <h2>État des stocks</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Stock</th>
                            <th>Vente/j</th>
                        </tr>
                    </thead>

                    <tbody id="tableau">
                    </tbody>
                </table>

            </div>

            <!-- Calculateur -->
            <div class="carte">

                <h2>Calculateur de stock</h2>

                <label for="produit">Choisir un produit :</label>

                <select id="produit" onchange="remplirDonnees()">
                    <option value="">-- Sélectionner --</option>
                </select>

                <label for="stock">Stock disponible :</label>
                <input type="number" id="stock" readonly>

                <label for="ventes">Ventes par jour :</label>
                <input type="number" id="ventes" readonly>

                <button onclick="calculerStock()">Calculer</button>

                <div id="resultat"></div>

            </div>

        </div>
    </div>

    <script>

        // Données issues du tableau Excel
        const produits = [
            { nom: "Café 250g", stock: 40, ventes: 4 },
            { nom: "Huile d'olive 1L", stock: 160, ventes: 24 },
            { nom: "Pâtes 500g", stock: 75, ventes: 16 },
            { nom: "Lait 1L", stock: 30, ventes: 0 },
            { nom: "Sucre 1kg", stock: 220, ventes: 27 }
        ];

        // Afficher les produits dans le tableau et la liste
        function afficherProduits() {

            const tableau = document.getElementById("tableau");
            const liste = document.getElementById("produit");

            produits.forEach((p, index) => {

                // Ajouter une ligne au tableau
                const ligne = document.createElement("tr");

                ligne.innerHTML = `
                    <td>${p.nom}</td>
                    <td>${p.stock}</td>
                    <td>${p.ventes}</td>
                `;

                tableau.appendChild(ligne);

                // Ajouter le produit dans la liste
                const option = document.createElement("option");

                option.value = index;
                option.textContent = p.nom;

                liste.appendChild(option);

            });
        }

        // Remplir automatiquement les informations
        function remplirDonnees() {

            const choix = document.getElementById("produit").value;
            const resultat = document.getElementById("resultat");

            resultat.style.display = "none";

            if (choix === "") {
                document.getElementById("stock").value = "";
                document.getElementById("ventes").value = "";
                return;
            }

            const produit = produits[choix];

            document.getElementById("stock").value = produit.stock;
            document.getElementById("ventes").value = produit.ventes;
        }

        // Calculer le nombre de jours avant la rupture du stock
        function calculerStock() {

            const choix = document.getElementById("produit").value;
            const stock = Number(document.getElementById("stock").value);
            const ventes = Number(document.getElementById("ventes").value);
            const resultat = document.getElementById("resultat");

            resultat.style.display = "block";
            resultat.className = "";

            if (choix === "") {
                resultat.textContent = "Veuillez sélectionner un produit.";
                resultat.classList.add("alerte");
                return;
            }

            if (stock < 0 || ventes < 0) {
                resultat.textContent = "Les valeurs doivent être positives.";
                resultat.classList.add("alerte");
                return;
            }

            if (stock === 0) {
                resultat.textContent = "Attention ! Le stock est épuisé.";
                resultat.classList.add("alerte");
                return;
            }

            if (ventes === 0) {
                resultat.textContent = "Aucune vente enregistrée pour ce produit.";
                resultat.classList.add("normal");
                return;
            }

            const jours = Math.ceil(stock / ventes);

            if (jours <= 3) {
                resultat.textContent =
                    "⚠️ Alerte ! Rupture de stock dans " + jours + " jour(s).";

                resultat.classList.add("alerte");
            } else {
                resultat.textContent =
                    "Stock suffisant. Rupture estimée dans " + jours + " jours.";

                resultat.classList.add("normal");
            }
        }

        // Lancer l'affichage au chargement de la page
        afficherProduits();

    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inveep - Stock Alert</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #eff9f3;
    color: #234b35;
}

.container {
    max-width: 1000px;
    margin: auto;
}

/* LOGO */
header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
}

.logo {
    width: 48px;
    height: 48px;
    background: #168346;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo svg {
    width: 30px;
    height: 30px;
}

.nom-logo {
    font-size: 28px;
    font-weight: bold;
    color: #155b32;
}

.sous-titre {
    color: #64816d;
    font-size: 12px;
    margin-top: 3px;
}

h1 {
    color: #155b32;
    font-size: 25px;
    margin-bottom: 5px;
}

.description {
    color: #789080;
    font-size: 13px;
    margin-bottom: 25px;
}

/* CARTES */
.contenu {
    display: flex;
    gap: 20px;
    align-items: stretch;
}

.carte {
    flex: 1;
    min-width: 0;
    background: white;
    border-radius: 14px;
    padding: 22px;
    border-top: 5px solid #20a05a;
    box-shadow: 0 4px 12px rgba(20,90,50,0.07);
}

h2 {
    font-size: 17px;
    color: #155b32;
    margin-top: 0;
    margin-bottom: 18px;
}

/* TABLEAU */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th {
    background: #e2f3e8;
    color: #155b32;
    padding: 12px 7px;
}

td {
    padding: 12px 7px;
    text-align: center;
    border-bottom: 1px solid #e3eee6;
}

tbody tr:hover {
    background: #f4faf6;
}

/* CHAMPS MODIFIABLES */
label {
    display: block;
    margin-top: 14px;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: bold;
    color: #315c40;
}

input, select {
    display: block;
    width: 100%;
    padding: 12px;
    border: 1px solid #a9cfb5;
    border-radius: 7px;
    background: #ffffff;
    color: #234b35;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border: 2px solid #168346;
    background: #f7fff9;
}

/* BOUTON */
button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #168346;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #116b39;
}

/* RESULTAT */
#resultat {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 7px;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
}

.alerte {
    background: #fff0ed;
    color: #c0392b;
}

.normal {
    background: #e6f5eb;
    color: #168346;
}

/* PETITS ECRANS */
@media (max-width: 650px) {
    body {
        padding: 18px;
    }

    .contenu {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <header>
        <div class="logo">
            <svg viewBox="0 0 40 40" fill="none">
                <path d="M8 23C8 12 19 7 32 8C31 21 25 32 14 32C9 32 6 28 8 23Z"
                      fill="white"/>
                <path d="M9 31C15 23 21 18 29 13"
                      stroke="#168346"
                      stroke-width="2.5"
                      stroke-linecap="round"/>
            </svg>
        </div>

        <div>
            <div class="nom-logo">inveep</div>
            <div class="sous-titre">SMART STOCK MANAGEMENT</div>
        </div>
    </header>

    <h1>Stock Alert</h1>
    <p class="description">
        Suivi des stocks et prévision des ruptures
    </p>

    <div class="contenu">

        <!-- TABLEAU -->
        <div class="carte">
            <h2>État des stocks</h2>

            <table>
                <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Stock</th>
                        <th>Vente/j</th>
                    </tr>
                </thead>
                <tbody id="tableau"></tbody>
            </table>
        </div>

        <!-- CALCULATEUR -->
        <div class="carte">
            <h2>Calculateur de stock</h2>

            <label for="produit">Type de produit :</label>
            <select id="produit" onchange="remplirDonnees()">
                <option value="">Choisir un produit</option>
            </select>

            <label for="stock">Stock disponible :</label>
            <input
                type="number"
                id="stock"
                min="0"
                step="any"
                placeholder="Saisir le stock disponible"
            >

            <label for="ventes">Quantité vendue par jour :</label>
            <input
                type="number"
                id="ventes"
                min="0"
                step="any"
                placeholder="Cliquez ici pour saisir une valeur"
            >

            <button type="button" onclick="calculerStock()">
                Calculer
            </button>

            <div id="resultat" aria-live="polite"></div>
        </div>

    </div>
</div>

<script>

// DONNEES INITIALES
const produits = [
    { nom: "Café 250g", stock: 40, ventes: 4 },
    { nom: "Huile d'olive 1L", stock: 160, ventes: 24 },
    { nom: "Pâtes 500g", stock: 75, ventes: 16 },
    { nom: "Lait 1L", stock: 30, ventes: 0 },
    { nom: "Sucre 1kg", stock: 220, ventes: 27 }
];

const tableau = document.getElementById("tableau");
const liste = document.getElementById("produit");
const champStock = document.getElementById("stock");
const champVentes = document.getElementById("ventes");
const resultat = document.getElementById("resultat");

// AFFICHER LE TABLEAU ET LES PRODUITS
produits.forEach((p, index) => {

    tableau.innerHTML += `
        <tr>
            <td>${p.nom}</td>
            <td>${p.stock}</td>
            <td>${p.ventes}</td>
        </tr>
    `;

    liste.innerHTML += `
        <option value="${index}">${p.nom}</option>
    `;
});

// REMPLIR LES CHAMPS
function remplirDonnees() {

    const choix = liste.value;

    resultat.style.display = "none";

    if (choix === "") {
        champStock.value = "";
        champVentes.value = "";
        return;
    }

    const p = produits[Number(choix)];

    champStock.value = p.stock;
    champVentes.value = p.ventes;
}

// EFFACER L'ANCIEN RESULTAT LORS D'UNE MODIFICATION
champStock.addEventListener("input", function() {
    resultat.style.display = "none";
});

champVentes.addEventListener("input", function() {
    resultat.style.display = "none";
});

// CALCULER LA RUPTURE DE STOCK
function calculerStock() {

    const choix = liste.value;
    const stockTexte = champStock.value;
    const ventesTexte = champVentes.value;

    resultat.style.display = "block";

    if (choix === "" || stockTexte.trim() === "" ||
        ventesTexte.trim() === "") {

        resultat.className = "alerte";
        resultat.textContent = "Veuillez remplir tous les champs.";
        return;
    }

    const stock = Number(stockTexte);
    const ventes = Number(ventesTexte);

    if (!Number.isFinite(stock) || !Number.isFinite(ventes) ||
        stock < 0 || ventes < 0) {

        resultat.className = "alerte";
        resultat.textContent = "Veuillez saisir des valeurs valides.";
        return;
    }

    if (stock === 0) {
        resultat.className = "alerte";
        resultat.textContent = "Attention ! Le stock est épuisé.";
        return;
    }

    if (ventes === 0) {
        resultat.className = "normal";
        resultat.textContent = "Aucune vente enregistrée.";
        return;
    }

    const jours = Math.ceil(stock / ventes);

    if (jours <= 3) {
        resultat.className = "alerte";
        resultat.textContent =
            "Alerte ! Rupture estimée dans " + jours + " jour(s).";
    } else {
        resultat.className = "normal";
        resultat.textContent =
            "Stock suffisant. Rupture estimée dans " + jours + " jours.";
    }
}

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inveep - Stock Alert</title>

  <style>
    body {
      margin: 0;
      padding: 40px 7%;
      font-family: Arial, sans-serif;
      background: #eff9f3;
      color: #111;
    }

    h1, h2 {
      color: #155b32;
    }

    h1 {
      font-size: 42px;
    }

    h2 {
      font-size: 30px;
    }

    .carte {
      background: white;
      border-top: 10px solid #20a05a;
      border-radius: 22px;
      padding: 25px 30px;
      margin: 25px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 18px;
    }

    th, td {
      text-align: left;
      padding: 15px 10px;
      border-bottom: 1px solid #cfe5d6;
    }

    label {
      display: block;
      margin-top: 22px;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      max-width: 350px;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 7px;
      font-size: 17px;
      border: 1px solid #888;
      border-radius: 5px;
      background: white;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      background: #20a05a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #187d45;
    }

    #resultat {
      margin-top: 25px;
      font-size: 19px;
    }

    .alerte {
      color: red;
      font-weight: bold;
    }

    .normal {
      color: #168346;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 5%;
      }

      h1 {
        font-size: 34px;
      }

      .carte {
        padding: 20px 15px;
      }

      table {
        font-size: 15px;
      }

      th, td {
        padding: 12px 5px;
      }
    }
  </style>
</head>

<body>

  <h1>inveep</h1>
  <h2>Stock Alert</h2>

  <!-- Tableau des produits -->
  <div class="carte">
    <table>
      <thead>
        <tr>
          <th>Produit</th>
          <th>Stock</th>
          <th>Vente/j</th>
        </tr>
      </thead>

      <tbody id="tableauProduits"></tbody>
    </table>
  </div>

  <!-- Formulaire de calcul -->
  <div class="carte">

    <label for="produit">Type de produit :</label>
    <select id="produit" onchange="remplirChamps()"></select>

    <label for="stock">Stock :</label>
    <input type="number" id="stock" min="0">

    <label for="ventes">Ventes par jour :</label>
    <input type="number" id="ventes" min="0">

    <button onclick="calculer()">Calculer</button>

    <div id="resultat"></div>

  </div>

  <script>

    // Données du fichier Excel
    const produits = [
      { nom: "café:250g", stock: 40, ventes: 4 },
      { nom: "Huile d'olive 1L", stock: 160, ventes: 24 },
      { nom: "pates:500g", stock: 75, ventes: 16 },
      { nom: "Lait 1L", stock: 30, ventes: 0 },
      { nom: "Sucre 1kg", stock: 220, ventes: 27 }
    ];

    const tableau = document.getElementById("tableauProduits");
    const liste = document.getElementById("produit");

    // Afficher les produits dans le tableau
    produits.forEach((p, index) => {

      tableau.innerHTML += `
        <tr>
          <td>${p.nom}</td>
          <td>${p.stock}</td>
          <td>${p.ventes}</td>
        </tr>
      `;

      liste.innerHTML += `
        <option value="${index}">${p.nom}</option>
      `;

    });

    // Remplir les champs automatiquement
    function remplirChamps() {

      const p = produits[Number(liste.value)];

      document.getElementById("stock").value = p.stock;
      document.getElementById("ventes").value = p.ventes;

      document.getElementById("resultat").innerHTML = "";

    }

    // Calculer les jours avant la rupture
    function calculer() {

      const nom = produits[Number(liste.value)].nom;

      const stockTexte = document.getElementById("stock").value;
      const ventesTexte = document.getElementById("ventes").value;

      const stock = Number(stockTexte);
      const ventes = Number(ventesTexte);

      const resultat = document.getElementById("resultat");

      if (
        stockTexte === "" ||
        ventesTexte === "" ||
        !Number.isFinite(stock) ||
        !Number.isFinite(ventes) ||
        stock < 0 ||
        ventes < 0
      ) {

        resultat.innerHTML =
          '<span class="alerte">Veuillez saisir des valeurs valides.</span>';

        return;
      }

      if (stock === 0) {

        resultat.innerHTML = `
          <b>${nom} :</b> stock déjà épuisé.<br>
          <span class="alerte">Rupture de stock !</span>
        `;

      } else if (ventes === 0) {

        resultat.innerHTML = `
          <b>${nom} :</b>
          Aucune vente journalière.
          Le nombre de jours avant rupture ne peut pas être calculé.
        `;

      } else {

        const jours = Math.ceil(stock / ventes);

        let message = jours <= 3
          ? '<span class="alerte">Rupture probable !</span>'
          : '<span class="normal">Stock suffisant pour le moment.</span>';

        resultat.innerHTML = `
          <b>${nom} :</b>
          Environ ${jours} jour(s) avant rupture.<br>
          ${message}
        `;

      }

    }

    // Afficher le premier produit au démarrage
    remplirChamps();

  </script>

</body>
</html>

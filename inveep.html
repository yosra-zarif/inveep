
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inveep - Stock Alert</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f4f8f5;
    color: #26382d;
}

.container {
    max-width: 1100px;
    margin: auto;
}

header {
    background: #176b45;
    color: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

.main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h2 {
    color: #176b45;
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 13px 8px;
    text-align: left;
    border-bottom: 1px solid #e6eee8;
}

th {
    background: #edf5ef;
    color: #176b45;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd9cf;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

input:focus, select:focus {
    outline: 2px solid #72ad89;
    border-color: #176b45;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #176b45;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #105536;
}

.result {
    margin-top: 22px;
    padding: 20px;
    border-radius: 10px;
    display: none;
    text-align: center;
}

.result h3 {
    margin-top: 0;
}

.result .days {
    font-size: 30px;
    font-weight: bold;
    margin: 12px 0;
}

/* Couleurs des trois niveaux de risque */

.risk-high {
    background: #fde8e8;
    border: 1px solid #e53935;
    color: #c62828;
}

.risk-medium {
    background: #fff1df;
    border: 1px solid #f39c12;
    color: #c77700;
}

.risk-low {
    background: #e5f5e9;
    border: 1px solid #2e9d50;
    color: #207a3b;
}

.risk-neutral {
    background: #edf1f3;
    border: 1px solid #9aa8ae;
    color: #455a64;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #718078;
    font-size: 13px;
}

@media(max-width: 750px) {
    body {
        padding: 15px;
    }

    .main {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🌿 Inveep - Stock Alert</h1>
    <p>Suivi intelligent des stocks et anticipation des risques de rupture</p>
</header>

<div class="main">

    <!-- Tableau des produits -->
    <div class="card">
        <h2>📦 Tableau des stocks</h2>

        <table>
            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Stock</th>
                    <th>Vente/j</th>
                </tr>
            </thead>

            <tbody id="productTable"></tbody>
        </table>
    </div>

    <!-- Calculateur -->
    <div class="card">
        <h2>📊 Analyse du stock</h2>

        <div class="form-group">
            <label for="product">Choisir un produit</label>
            <select id="product" onchange="selectProduct()">
                <option value="">-- Sélectionner --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stock">Stock disponible</label>
            <input type="number" id="stock" min="0" step="any"
                   placeholder="Saisir le stock">
        </div>

        <div class="form-group">
            <label for="sales">Ventes journalières</label>
            <input type="number" id="sales" min="0" step="any"
                   placeholder="Saisir les ventes par jour">
        </div>

        <button onclick="calculateRisk()">
            Calculer le risque
        </button>

        <div id="result" class="result">
            <h3 id="riskTitle"></h3>
            <div class="days" id="days"></div>
            <p id="message"></p>
        </div>

    </div>

</div>

<footer>
    Inveep © 2026 - Gestion intelligente des stocks
</footer>

</div>

<script>

// Données des produits
const products = [
    { name: "Café 250g", stock: 40, sales: 4 },
    { name: "Huile d'olive 1L", stock: 160, sales: 24 },
    { name: "Pâtes 500g", stock: 75, sales: 16 },
    { name: "Lait 1L", stock: 30, sales: 0 },
    { name: "Sucre 1kg", stock: 220, sales: 27 }
];

// Remplir le tableau
function displayProducts() {

    const table = document.getElementById("productTable");
    const select = document.getElementById("product");

    products.forEach((p, index) => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${p.name}</td>
            <td>${p.stock}</td>
            <td>${p.sales}</td>
        `;

        table.appendChild(row);

        const option = document.createElement("option");
        option.value = index;
        option.textContent = p.name;

        select.appendChild(option);
    });
}

// Sélectionner un produit
function selectProduct() {

    const index = document.getElementById("product").value;

    const result = document.getElementById("result");
    result.style.display = "none";

    if (index === "") {
        document.getElementById("stock").value = "";
        document.getElementById("sales").value = "";
        return;
    }

    const p = products[index];

    // Valeurs préremplies, mais modifiables manuellement
    document.getElementById("stock").value = p.stock;
    document.getElementById("sales").value = p.sales;
}

// Calculer le risque
function calculateRisk() {

    const stockInput = document.getElementById("stock").value;
    const salesInput = document.getElementById("sales").value;

    const stock = Number(stockInput);
    const sales = Number(salesInput);

    const result = document.getElementById("result");
    const riskTitle = document.getElementById("riskTitle");
    const daysElement = document.getElementById("days");
    const message = document.getElementById("message");

    // Vérification des données
    if (
        document.getElementById("product").value === "" ||
        stockInput === "" ||
        salesInput === "" ||
        !Number.isFinite(stock) ||
        !Number.isFinite(sales) ||
        stock < 0 ||
        sales < 0
    ) {
        alert("Veuillez saisir des valeurs valides.");
        return;
    }

    result.style.display = "block";

    // Réinitialiser les couleurs
    result.className = "result";

    // Cas où les ventes sont nulles
    if (sales === 0) {

        result.classList.add("risk-neutral");

        riskTitle.textContent = "Aucune vente enregistrée";
        daysElement.textContent = "∞";
        message.textContent =
            "Les ventes journalières sont nulles. Le risque de rupture ne peut pas être estimé.";

        return;
    }

    // Calcul du nombre de jours restants
    const remainingDays = stock / sales;

    daysElement.textContent = remainingDays.toFixed(1) + " jours";

    // Classification du risque
    if (remainingDays <= 3) {

        result.classList.add("risk-high");

        riskTitle.textContent = "🔴 RISQUE DE RUPTURE";

        message.textContent =
            "Attention ! Le stock risque d'être épuisé dans 3 jours ou moins. Un réapprovisionnement est urgent.";

    }

    else if (remainingDays <= 7) {

        result.classList.add("risk-medium");

        riskTitle.textContent = "🟠 RISQUE MOYEN";

        message.textContent =
            "Le stock est limité. Il est conseillé de prévoir un réapprovisionnement prochainement.";

    }

    else {

        result.classList.add("risk-low");

        riskTitle.textContent = "🟢 FAIBLE RISQUE";

        message.textContent =
            "Le stock est suffisant. Aucun réapprovisionnement urgent n'est nécessaire.";

    }
}

// Initialisation
displayProducts();

</script>

</body>
</html>

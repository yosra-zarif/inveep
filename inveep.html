<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jiotify – AquaFraud</title>
<style>
  body { margin: 0; padding: 30px; font: 16px Arial, sans-serif; background: #f3f6f8; color: #263746; }
  header { margin-bottom: 20px; }
  header img { height: 64px; border-radius: 12px; vertical-align: middle; }
  h1, h2 { color: #087e8b; }
  h1 { display: inline-block; vertical-align: middle; margin: 0 0 0 12px; }
  h2 { margin-top: 0; }
  .card { display: inline-block; vertical-align: top; width: 48%; margin-right: 1%; background: #fff; padding: 22px; border-radius: 12px; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px; border-bottom: 1px solid #e5e9ed; text-align: center; }
  th { background: #eaf4f5; color: #087e8b; }
  label { display: block; font-weight: bold; margin-top: 12px; }
  select, input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; font-size: 16px; border: 1px solid #c5d0d8; border-radius: 6px; }
  button { width: 100%; margin-top: 16px; padding: 12px; background: #087e8b; color: #fff; border: 0; border-radius: 6px; }
  .rouge { color: #dc2626; } .orange { color: #d97706; } .vert { color: #159447; }
  @media (max-width: 800px) { body { padding: 15px; } .card { width: 100%; margin: 0 0 20px; } }
</style>
</head>
<body>
<header><img src="logo.png"><h1>AquaFraud</h1></header>

<div class="card">
  <h2>Consommation des fermes</h2>
  <table id="tableau"></table>
</div>

<div class="card">
  <h2>Calcul de l'écart</h2>
  <label>Choisir la ferme</label>
  <select id="ferme" onchange="remplir()"></select>
  <label>Consommation prévue</label>
  <input id="prevue" type="number">
  <label>Consommation réelle</label>
  <input id="reelle" type="number">
  <button onclick="calculer()">Calculer</button>
  <p id="ecart"></p>
  <p id="message"></p>
</div>

<script>
var fermes = [["Ferme A", 100, 180], ["Ferme B", 150, 160], ["Ferme C", 120, 40]];
var $ = function (id) { return document.getElementById(id); };

// Tableau et liste déroulante
$("tableau").innerHTML = "<tr><th>Ferme</th><th>Prévue</th><th>Réelle</th></tr>" +
  fermes.map(function (f) { return "<tr><td>" + f.join("</td><td>") + "</td></tr>"; }).join("");
$("ferme").innerHTML = fermes.map(function (f, i) { return "<option value=" + i + ">" + f[0] + "</option>"; }).join("");

// Remplit prévue/réelle selon la ferme choisie
function remplir() {
  var f = fermes[$("ferme").value];
  $("prevue").value = f[1];
  $("reelle").value = f[2];
}

// Calcule l'écart et affiche le risque
function calculer() {
  var nom = fermes[$("ferme").value][0];
  var ecart = $("reelle").value - $("prevue").value;
  var pct = ecart / $("prevue").value * 100;
  var r = pct <= -50 ? ["rouge", "risque élevé, irrigation arrêtée"]
        : pct >= 50 ? ["rouge", "risque élevé, surconsommation"]
        : Math.abs(pct) >= 15 ? ["orange", "risque moyen, à vérifier"]
        : ["vert", "consommation normale"];
  $("ecart").innerHTML = "<b>Écart :</b> " + ecart;
  $("message").className = r[0];
  $("message").textContent = nom + " : " + r[1] + ".";
}
remplir();
</script>
</body>
</html>
